# Netlify configuration for MCB Brothers Construction
# Static site — no build step. Netlify serves the repo root as-is.

[build]
  publish = "."
  # No build command needed for a plain HTML/CSS/JS site.

# Always revalidate CSS/JS so edits show up immediately (cheap 304s via ETag).
# We also append ?v=N to the css/js URLs in index.html to bust any stale cache.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
