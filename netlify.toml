# Netlify configuration for MCB Brothers Construction
# Static site — no build step. Netlify serves the repo root as-is.

[build]
  publish = "."
  # No build command needed for a plain HTML/CSS/JS site.

# Long cache for static assets (safe: edit URLs or filenames to bust)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sensible baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
